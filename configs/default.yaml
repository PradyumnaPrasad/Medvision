# MEDVISION default configuration.
# Every threshold / model name / path used by medvision/* must come from here — no magic numbers in code.

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  kg_dir: "data/kg"
  chroma_dir: "data/chroma"
  models_dir: "data/models"
  uploads_dir: "data/uploads"
  kg_ontology_dir: "kg/ontology"
  labels_config: "configs/labels.yaml"

device:
  prefer: ["mps", "cuda", "cpu"]  # tried in order; first available wins

vision:
  classifier: "torchxrayvision"
  weights: "densenet121-res224-all"
  input_resolution: 224
  # thresholds are per-label overrides in calibration.json once T14 runs; these are the fallback defaults
  default_pos_threshold: 0.5
  default_uncertain_threshold: 0.3

gradcam:
  # last layer of the DenseNet feature extractor, i.e. the final conv feature map
  # before global-average-pool + the linear classifier head
  target_layer: "features.norm5"

qc:
  min_resolution: 128
  # Real chest X-rays measured here are grayscale medical images stored as RGB, so
  # their R/G/B channels are ~identical (color_variance ~0.0). A real color photo
  # measured ~110 on the same metric. See reports/ood_gate_calibration.md.
  max_color_variance: 8.0
  min_contrast_std: 15.0 # guards against blank/near-uniform images
  aspect_ratio_min: 0.4
  aspect_ratio_max: 2.5
  # Reserved for a BiomedCLIP-embedding-based OOD check once T16 is built; the
  # heuristic checks above catch color photos but not grayscale non-CXR images
  # (e.g. a different body part), which this would catch. Unused today.
  ood_similarity_threshold: 0.22

kg:
  reasoning:
    top_k_differentials: 3
    contradiction_penalty_weight: 1.0
    activation_threshold: 0.3  # a finding node "activates" the graph if calibrated prob >= this

align:
  # Image <-> knowledge-graph alignment (PLAN.md T16-T20). Trained on cached frozen DenseNet
  # features, so training is seconds on a laptop CPU.
  feature_dim: 1024
  embed_dim: 128
  hidden_dim: 256
  gnn_layers: 2
  gnn_heads: 4
  dropout: 0.2
  init_temperature: 0.07 # learnable; this is only the starting value
  node_loss_weight: 0.5 # weight of the image->KG-node contrastive term next to image<->graph-set
  lr: 0.001
  weight_decay: 0.0001
  epochs: 80
  patience: 12 # early stopping on validation loss
  batch_size: 256
  seed: 0
  features_file: "nih_features.npz" # under paths.processed_dir
  checkpoint_file: "alignment.pt" # under paths.models_dir
  nih_dir: "data/raw/nih"
  chroma_collection_nodes: "kg_nodes"
  chroma_collection_cases: "cases"
  min_positives_for_auroc: 20 # skip per-finding AUROC when a test split has fewer positives

retrieval:
  top_k_nodes: 5
  top_k_snippets: 5
  top_k_cases: 5
  cases_in_prompt: 3 # how many of the retrieved cases are shown to the LLM as C-evidence

llm:
  provider: "ollama"
  base_url: "http://127.0.0.1:11434"
  # gemma3:4b is what's actually pulled on the dev machine; swap to a larger model
  # (e.g. llama3.1:8b) if one is available — the client only needs Ollama's /api/generate.
  model: "gemma3:4b"
  temperature: 0.1
  timeout_s: 60
  max_retries: 2
  grounding_regenerate_threshold: 0.8

api:
  host: "0.0.0.0"
  port: 8000
  max_upload_mb: 20
  allowed_extensions: [".png", ".jpg", ".jpeg", ".dcm"]
  pdf_max_heatmaps: 3 # Grad-CAM overlays included in the PDF export (after the original image)
  feedback_max_comment_chars: 2000

io:
  dicom:
    # Only plain radiograph modalities are accepted (CR = computed, DX = digital radiography);
    # CT/MR/US etc. are rejected up front rather than run through a chest-X-ray classifier.
    allowed_modalities: ["CR", "DX"]
    # The classifier is trained on frontal views only.
    rejected_view_positions: ["LL", "RL", "LAT", "LATERAL"]
    # Intensity clip (percentiles) used when a DICOM carries no VOI window/LUT of its own.
    fallback_percentiles: [0.5, 99.5]
    # BodyPartExamined values containing any of these are treated as chest; anything else
    # only produces a soft warning (the tag is often missing or wrong on real scanners).
    chest_body_parts: ["CHEST", "THORAX", "LUNG", "RIB", "HEART"]

disclaimer: "Research prototype for a college major project. Not a certified medical device. Not for clinical use."
