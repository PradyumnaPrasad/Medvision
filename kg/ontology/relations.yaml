# Edges of the MEDVISION knowledge graph. Every edge MUST carry a weight (0-1) and a source,
# so every step of a diagnosis path can be traced back to why it exists (PLAN.md section 4.2).
# Weights here are hand-set by the team from general clinical/radiology teaching knowledge for
# a college project — they are illustrative, not clinically validated (see README limitations).
#
# Relation types:
#   suggestive_of   Finding -> Disease   (positive evidence toward a diagnosis)
#   contradicts     Finding -> Disease   (negative evidence against a diagnosis)
#   differential_of Disease -> Disease   (commonly confused / competing diagnoses)
#   complication_of Disease -> Disease   (one disease can progress into another)
#   located_in      Finding -> Anatomy   (typical/possible site for this finding; not exclusive)
#   part_of         Anatomy -> Anatomy   (containment hierarchy)
edges:
  # --- suggestive_of: Finding -> Disease ---
  - src: F_CONSOLIDATION
    rel: suggestive_of
    dst: D_PNEUMONIA
    weight: 0.85
    source: team
    note: "Consolidation is the classic radiographic sign of infective pneumonia."
  - src: F_CONSOLIDATION
    rel: suggestive_of
    dst: D_LUNG_ABSCESS
    weight: 0.3
    source: team
  - src: F_CONSOLIDATION
    rel: suggestive_of
    dst: D_ARDS
    weight: 0.3
    source: team

  - src: F_INFILTRATION
    rel: suggestive_of
    dst: D_PNEUMONIA
    weight: 0.4
    source: team
    note: >
      Lowered from 0.6 after reports/false_alarm_investigation.md found this single
      edge responsible for 100% of D_PNEUMONIA false-alarm cases (Pneumonia wrongly
      ranked #1 on 147/304 real normal chest X-rays) — "Infiltration" is a widely
      documented nonspecific finding (it can indicate pneumonia, edema, fibrosis,
      atelectasis and more) and had the weakest classifier AUROC of the four
      pneumonia-correlated findings (0.731 vs 0.95+ for Consolidation/Lung Opacity).
      0.4 was chosen (not the margin-optimal 0.3) to keep Recall@1 above 85% since
      this is a clinician-reviewed decision-support tool, not an autonomous
      diagnosis — a missed true case is worse here than an extra reviewed false
      alarm. See that report for the full weight-sweep evidence.
  - src: F_INFILTRATION
    rel: suggestive_of
    dst: D_TUBERCULOSIS
    weight: 0.4
    source: team
  - src: F_INFILTRATION
    rel: suggestive_of
    dst: D_IDIOPATHIC_PULMONARY_FIBROSIS
    weight: 0.3
    source: team

  - src: F_PNEUMONIA_OPACITY
    rel: suggestive_of
    dst: D_PNEUMONIA
    weight: 0.9
    source: team

  - src: F_EFFUSION
    rel: suggestive_of
    dst: D_CHF
    weight: 0.6
    source: team
  - src: F_EFFUSION
    rel: suggestive_of
    dst: D_PLEURAL_EFFUSION_MALIGNANT
    weight: 0.4
    source: team
  - src: F_EFFUSION
    rel: suggestive_of
    dst: D_PULMONARY_EMBOLISM
    weight: 0.3
    source: team
  - src: F_EFFUSION
    rel: suggestive_of
