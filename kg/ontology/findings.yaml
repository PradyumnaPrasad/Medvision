# Finding nodes: radiographic signs a classifier or a radiologist can observe directly.
# These ids MUST match configs/labels.yaml's label_to_node values 1:1 for the 18 mapped
# torchxrayvision outputs, plus F_NO_FINDING for "normal" studies (used in entity linking, T13).
nodes:
  - id: F_NO_FINDING
    type: Finding
    name: No Finding
    aliases: [normal study, no acute findings]
    definition: "No radiographic abnormality identified on the study."
    source: team

  - id: F_ATELECTASIS
    type: Finding
    name: Atelectasis
    aliases: [collapse, volume loss]
    definition: "Partial or complete collapse of lung tissue, reducing aeration of the affected region."
    mesh_id: D001206
    source: mesh

  - id: F_CONSOLIDATION
    type: Finding
    name: Consolidation
    aliases: [airspace opacity, airspace disease]
    definition: "Airspaces filled with fluid, pus, blood or cells instead of air, seen as a dense opacity."
    mesh_id: D011014
    source: mesh

  - id: F_INFILTRATION
    type: Finding
    name: Infiltration
    aliases: [pulmonary infiltrate]
    definition: "Any substance denser than air occupying lung parenchyma, seen as hazy or patchy opacity."
    source: team

  - id: F_PNEUMOTHORAX
    type: Finding
    name: Pneumothorax
    aliases: [collapsed lung, air in pleural space]
    definition: "Air in the pleural space causing partial or complete lung collapse."
    mesh_id: D011030
    source: mesh

  - id: F_EDEMA
    type: Finding
    name: Pulmonary Edema
    aliases: [fluid overload, vascular congestion]
    definition: "Fluid accumulation in the lung interstitium and alveoli, often from cardiac causes."
    mesh_id: D011654
    source: mesh

  - id: F_EMPHYSEMA
    type: Finding
    name: Emphysema
    aliases: [hyperinflation]
    definition: "Permanent airspace enlargement distal to the terminal bronchiole with destruction of alveolar walls."
    mesh_id: D004646
    source: mesh

  - id: F_FIBROSIS
    type: Finding
    name: Pulmonary Fibrosis
    aliases: [scarring, reticular opacity]
    definition: "Scarring of lung tissue producing reticular or linear opacities and reduced lung volume."
    mesh_id: D011658
    source: mesh

  - id: F_EFFUSION
    type: Finding
    name: Pleural Effusion
    aliases: [fluid in pleural space]
    definition: "Abnormal fluid accumulation in the pleural space, seen as blunting of the costophrenic angle."
    mesh_id: D010996
    source: mesh

  - id: F_PNEUMONIA_OPACITY
    type: Finding
    name: Pneumonia-pattern Opacity
    aliases: [infectious infiltrate]
    definition: "An airspace opacity pattern radiographically consistent with infectious pneumonia."
    source: team

  - id: F_PLEURAL_THICKENING
    type: Finding
    name: Pleural Thickening
    aliases: [pleural scarring]
    definition: "Thickening of the pleural membrane, often from prior inflammation, infection or asbestos exposure."
    source: team

  - id: F_CARDIOMEGALY
    type: Finding
    name: Cardiomegaly
    aliases: [enlarged heart, increased cardiothoracic ratio]
    definition: "Enlargement of the cardiac silhouette, typically a cardiothoracic ratio greater than 0.5 on PA film."
    mesh_id: D002311
    source: mesh

  - id: F_NODULE
    type: Finding
    name: Pulmonary Nodule
    aliases: [small round opacity]
    definition: "A round or oval opacity in the lung up to 3 cm in diameter, well or poorly defined."
    mesh_id: D014066
    source: mesh

  - id: F_MASS
    type: Finding
    name: Pulmonary Mass
    aliases: [large opacity]
    definition: "A pulmonary opacity larger than 3 cm, raising higher suspicion for malignancy than a nodule."
    source: team

  - id: F_HERNIA
    type: Finding
    name: Hiatal Hernia
    aliases: [diaphragmatic hernia]
    definition: "Protrusion of abdominal contents (usually stomach) through the diaphragm into the thorax."
    mesh_id: D006549
    source: mesh

  - id: F_LUNG_LESION
    type: Finding
    name: Lung Lesion
    aliases: [focal lung abnormality]
    definition: "A focal abnormality of lung parenchyma not further specified as nodule, mass or consolidation."
    source: team

  - id: F_FRACTURE
    type: Finding
    name: Rib Fracture
    aliases: [bony fracture]
    definition: "A break in bony cortex, most commonly involving a rib on chest radiographs."
    mesh_id: D050723
    source: mesh

  - id: F_LUNG_OPACITY
    type: Finding
    name: Lung Opacity
    aliases: [nonspecific opacity]
    definition: "Any area of increased density in the lung field not further characterized."
    source: team

  - id: F_ENLARGED_MEDIASTINUM
    type: Finding
    name: Enlarged Cardiomediastinum
    aliases: [widened mediastinum]
    definition: "Widening of the mediastinal silhouette, which may reflect cardiomegaly, masses, or vascular pathology."
    source: team
