[project]
name = "medvision"
version = "0.1.0"
description = "Knowledge-graph anchored vision-reasoning framework for explainable clinical diagnosis (research prototype)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchxrayvision>=1.2.3",
    "grad-cam>=1.5.0",
    "pillow>=10.0",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "pydicom>=2.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "reportlab>=5.1.0",
    "torch-geometric>=2.8.1",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "pypdf>=7.1.0",
    "pytest>=8.0",
    "ruff>=0.4",
    "scipy>=1.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (downloads models/data)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["medvision"]
